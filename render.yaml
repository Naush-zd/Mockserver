# Render Blueprint — free demo deployment.
#
# Deploys two of the four compose services onto Render:
#   - microcks  : the mock engine, as a PRIVATE service (not publicly exposed).
#   - dashboard : the Express API + dashboard, as a PUBLIC web service. The
#                 Next.js frontend lives on Vercel and calls this over HTTPS
#                 via its BACKEND_URL env var (see deployment/RENDER-VERCEL.md).
#
# The compose `import` step runs at container boot instead: entrypoint.sh
# kicks off import-to-microcks.sh in the background (pre-deploy commands aren't
# allowed on Render's free tier). The script polls Microcks until ready, then
# uploads the baked-in specs.
#
# NOTES / free-tier caveats:
#   - Free instances spin down after ~15 min idle; first request after that is
#     a slow cold start and Microcks re-imports its specs on wake.
#   - microcks-uber is memory-heavy and may be unstable on the 512MB free plan.
#     If it OOMs, bump the microcks service to `plan: starter`. The dashboard
#     falls back to @graphql-tools/mock when Microcks is unreachable.
#   - Private services (`type: pserv`) are not available on the free plan, so
#     Microcks runs as a `type: web` service here. It gets a public
#     .onrender.com URL, but the dashboard still reaches it over Render's
#     internal private network via `fromService` hostport — the public URL is
#     just an unused side effect. If you'd rather not expose the raw engine,
#     upgrade the account and switch it back to `type: pserv`.

services:
  # ─── Mock engine ────────────────────────────────────────────────────────
  # Runs as a public web service (free tier has no private services), but the
  # dashboard talks to it over the internal network — see MICROCKS_URL below.
  - name: mockserver-microcks
    type: web
    runtime: image
    plan: free
    image:
      url: quay.io/microcks/microcks-uber:latest
    # microcks-uber exposes THREE ports: 8080 (HTTP UI/API), 9090 (gRPC), and an
    # embedded MongoDB. Left to auto-detect, Render probed a non-HTTP port and
    # the health checks landed on Mongo/gRPC ("message too large" / "Unexpected
    # HTTP/1.x request"). Pin PORT=8080 so Render routes and health-checks the
    # HTTP server, and point the check at Microcks' real health endpoint.
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"

  # ─── Dashboard / Express API (public) ───────────────────────────────────
  - name: mockserver-dashboard
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # NOTE: no preDeployCommand — not supported on free tier. The dashboard's
    # entrypoint.sh imports the baked-in specs into Microcks at boot instead.
    envVars:
      - key: PORT
        value: "4010"
      # Internal (private-network) address of the Microcks service, host:port.
      # config.cjs / import-to-microcks.sh prepend http:// to this bare value.
      - key: MICROCKS_URL
        fromService:
          name: mockserver-microcks
          type: web
          property: hostport
      - key: ARTIFACTS_DIR
        value: /app/artifacts
      # Ephemeral on free tier — resets on redeploy. Acceptable for a demo.
      - key: STATE_FILE_PATH
        value: /app/artifacts/state.json
      # AI features run in fallback mode unless AI_API_KEY / AI_BASE_URL are set.
      - key: AI_PROVIDER
        value: local
